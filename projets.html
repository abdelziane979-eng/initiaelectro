      'Ajoute un interrupteur (simule la porte).',
      'Place un buzzer.',
      'Câble : pile (+) → interrupteur → buzzer → pile (-).',
      'Ferme l\'interrupteur : le buzzer sonne !'
    ]
  }
};

/* =========================================================
   NOMS DES CATÉGORIES ET DES COMPOSANTS
   ========================================================= */
var NOMS_CATEGORIES = {
  initiation: { nom: '💡 Initiation', ordre: 1 },
  maison: { nom: '🏠 Maison', ordre: 2 },
  ecologie: { nom: '🌱 Écologie', ordre: 3 },
  jeux: { nom: '🎮 Jeux & Sons', ordre: 4 },
  vehicules: { nom: '🚗 Véhicules', ordre: 5 },
  capteurs: { nom: '🔬 Capteurs', ordre: 6 },
  securite: { nom: '🔒 Sécurité', ordre: 7 },
  autres: { nom: '📦 Autres', ordre: 99 }
};

var NOMS_COMPOSANTS = {
  pile: '🔋 Pile 9V',
  resistance: '🎨 Résistance',
  led: '💡 LED',
  interrupteur: '🔘 Interrupteur',
  bouton: '🧲 Bouton poussoir',
  boutonPoussoir: '🧲 Bouton poussoir',
  buzzer: '🔊 Buzzer',
  ne555: '⚡ NE555',
  cd4017: '🔢 CD4017',
  condensateur: '🔌 Condensateur',
  transistor: '🎛️ Transistor 2N2222',
  ldr: '📏 LDR',
  thermistance: '🌡️ Thermistance',
  capteurIr: '📡 Capteur IR',
  moteurDc: '🔄 Moteur DC',
  porteAnd: '🚪 Porte AND'
};

/* =========================================================
   INITIALISATION
   ========================================================= */
window.onload = function() {
  afficherTousDefis();
};

/* Afficher tous les défis (groupés par catégorie) */
function afficherTousDefis() {
  var conteneur = document.getElementById('contenu-defis');
  if (!conteneur) return;
  
  var html = '';
  var defisParCategorie = {};
  for (var id in DEFIS) {
    var d = DEFIS[id];
    var cat = d.categorie || 'autres';
    if (!defisParCategorie[cat]) defisParCategorie[cat] = [];
    defisParCategorie[cat].push(d);
  }
  
  var catsTriees = Object.keys(defisParCategorie).sort(function(a, b) {
    return (NOMS_CATEGORIES[a] ? NOMS_CATEGORIES[a].ordre : 99) - (NOMS_CATEGORIES[b] ? NOMS_CATEGORIES[b].ordre : 99);
  });
  
  for (var i = 0; i < catsTriees.length; i++) {
    var cat = catsTriees[i];
    var liste = defisParCategorie[cat];
    var nomCat = NOMS_CATEGORIES[cat] ? NOMS_CATEGORIES[cat].nom : '📦 Autres';
    
    html += '<h2 class="categorie-titre">' + nomCat + ' <span style="font-size:0.6em;color:#94a3b8;font-weight:normal;">(' + liste.length + ' défis)</span></h2>';
    html += '<div class="grille-defis">';
    for (var j = 0; j < liste.length; j++) {
      var d = liste[j];
      html += '<div class="carte-defi" onclick="ouvrirFiche(\'' + d.id + '\')">';
      html += '<div class="emoji">' + d.icone + '</div>';
      html += '<h3>' + d.nom + '</h3>';
      html += '<div class="desc">' + d.desc + '</div>';
      html += '<div class="meta">📦 ' + (d.composants_requis ? d.composants_requis.length : 0) + ' composants</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  
  conteneur.innerHTML = html;
}

/* Filtrer les défis */
function filtrerDefis() {
  var texte = document.getElementById('recherche').value.toLowerCase();
  var cat = document.getElementById('filtre-categorie').value;
  
  var conteneur = document.getElementById('contenu-defis');
  var html = '';
  var defisParCategorie = {};
  
  for (var id in DEFIS) {
    var d = DEFIS[id];
    var okTexte = !texte || d.nom.toLowerCase().indexOf(texte) !== -1 || d.desc.toLowerCase().indexOf(texte) !== -1;
    var okCat = (cat === 'toutes') || d.categorie === cat;
    if (okTexte && okCat) {
      var catD = d.categorie || 'autres';
      if (!defisParCategorie[catD]) defisParCategorie[catD] = [];
      defisParCategorie[catD].push(d);
    }
  }
  
  if (Object.keys(defisParCategorie).length === 0) {
    html = '<div class="aucun-resultat">Aucun défi trouvé.</div>';
  } else {
    var catsTriees = Object.keys(defisParCategorie).sort(function(a, b) {
      return (NOMS_CATEGORIES[a] ? NOMS_CATEGORIES[a].ordre : 99) - (NOMS_CATEGORIES[b] ? NOMS_CATEGORIES[b].ordre : 99);
    });
    
    for (var i = 0; i < catsTriees.length; i++) {
      var catN = catsTriees[i];
      var liste = defisParCategorie[catN];
      var nomCat = NOMS_CATEGORIES[catN] ? NOMS_CATEGORIES[catN].nom : '📦 Autres';
      
      html += '<h2 class="categorie-titre">' + nomCat + ' <span style="font-size:0.6em;color:#94a3b8;font-weight:normal;">(' + liste.length + ' défis)</span></h2>';
      html += '<div class="grille-defis">';
      for (var j = 0; j < liste.length; j++) {
        var d = liste[j];
        html += '<div class="carte-defi" onclick="ouvrirFiche(\'' + d.id + '\')">';
        html += '<div class="emoji">' + d.icone + '</div>';
        html += '<h3>' + d.nom + '</h3>';
        html += '<div class="desc">' + d.desc + '</div>';
        html += '<div class="meta">📦 ' + (d.composants_requis ? d.composants_requis.length : 0) + ' composants</div>';
        html += '</div>';
      }
      html += '</div>';
    }
  }
  
  conteneur.innerHTML = html;
}

/* Ouvrir la fiche détaillée d'un défi */
function ouvrirFiche(id) {
  var d = DEFIS[id];
  if (!d) return;
  
  var nomCat = NOMS_CATEGORIES[d.categorie] ? NOMS_CATEGORIES[d.categorie].nom : 'Autres';
  
  var html = '<div class="fiche-entete">';
  html += '<div class="emoji">' + d.icone + '</div>';
  html += '<h2>' + d.nom + '</h2>';
  html += '<div class="categorie">' + nomCat + '</div>';
  html += '</div>';
  
  html += '<div class="fiche-section">';
  html += '<h4>📖 Description</h4>';
  html += '<p>' + d.desc + '</p>';
  html += '</div>';
  
  if (d.composants_requis && d.composants_requis.length > 0) {
    html += '<div class="fiche-section">';
    html += '<h4>📦 Composants nécessaires (' + d.composants_requis.length + ')</h4>';
    html += '<div class="liste-composants">';
    for (var i = 0; i < d.composants_requis.length; i++) {
      var comp = d.composants_requis[i];
      var nomComp = NOMS_COMPOSANTS[comp] || comp;
      html += '<span class="badge-composant">' + nomComp + '</span>';
    }
    html += '</div>';
    html += '</div>';
  }
  
  if (d.explication) {
    html += '<div class="fiche-section">';
    html += '<h4>⚡ Comment ça marche ?</h4>';
    html += '<p>' + d.explication + '</p>';
    html += '</div>';
  }
  
  if (d.etapes && d.etapes.length > 0) {
    html += '<div class="fiche-section">';
    html += '<h4>🔧 Étapes de construction</h4>';
    html += '<ol class="etapes-liste">';
    for (var j = 0; j < d.etapes.length; j++) {
      html += '<li>' + d.etapes[j] + '</li>';
    }
    html += '</ol>';
    html += '</div>';
  }
  
  html += '<a href="bac_a_sable.html" class="btn-lancer" target="_blank">🧪 Lancer le défi dans le Bac à sable</a>';
  
  document.getElementById('contenu-fiche').innerHTML = html;
  document.getElementById('modal-fiche').classList.add('actif');
}

/* Fermer la fiche */
function fermerFiche() {
  document.getElementById('modal-fiche').classList.remove('actif');
}

/* Fermer en cliquant en dehors */
document.getElementById('modal-fiche').addEventListener('click', function(e) {
  if (e.target === this) fermerFiche();
});
</script>
