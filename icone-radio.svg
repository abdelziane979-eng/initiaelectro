  <rect x="334" y="266" width="12" height="20" fill="#c9a84c"/>
  <rect x="334" y="306" width="12" height="20" fill="#c9a84c"/>
  
  <!-- Cœur de la puce -->
  <rect x="206" y="206" width="100" height="100" rx="8" fill="#0f172a"/>
