<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Les Mots Pièges</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fee2e2; margin: 0; }
  .carte { background: white; padding: 20px; border-radius: 15px; max-width: 600px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1 { color: #991b1b; }
  .btn { padding: 15px 30px; font-size: 1.2em; margin: 10px; cursor: pointer; border: none; border-radius: 10px; color: white; font-weight: bold; font-family: inherit; }
  .btn:hover { opacity: 0.9; }
  .vert { background: #22c55e; }
  .jaune { background: #f59e0b; }
  .rouge { background: #ef4444; }
  .prop { background: #3b82f6; padding: 20px 40px; font-size: 1.5em; margin: 10px; cursor: pointer; border: none; border-radius: 10px; color: white; font-weight: bold; font-family: inherit; min-width: 100px; }
  .prop:hover { opacity: 0.9; }
  .prop:disabled { cursor: not-allowed; }
  .phrase { font-size: 1.5em; font-weight: bold; margin: 20px 0; padding: 20px; background: #fef3c7; border-radius: 10px; }
  .msg { padding: 15px; border-radius: 10px; margin: 15px 0; font-weight: bold; min-height: 50px; }
  .info { background: #dbeafe; color: #1e40af; }
  .ok { background: #dcfce7; color: #166534; }
  .ko { background: #fee2e2; color: #991b1b; }
  .cache { display: none; }
  .trou { color: red; border-bottom: 2px solid red; padding: 0 10px; }
</style>
</head>
<body>

<div id="ecran1" class="carte">
  <h1>🪤 Les Mots Pièges</h1>
  <p>Choisis ton niveau :</p>
  <button class="btn vert" onclick="demarrer(0)">🟢 Facile</button>
  <button class="btn jaune" onclick="demarrer(1)">🟡 Moyen</button>
  <button class="btn rouge" onclick="demarrer(2)">🔴 Difficile</button>
</div>

<div id="ecran2" class="carte cache">
  <p><span id="num">1</span> / 10</p>
  <div class="phrase" id="phrase"></div>
  <button class="prop" id="btnA" onclick="cliqueA()">A</button>
  <button class="prop" id="btnB" onclick="cliqueB()">B</button>
  <div class="msg info" id="msg">Clique sur le bon mot !</div>
  <a href="index.html" style="display:inline-block;margin-top:15px;color:#64748b;">← Retour</a>
</div>

<div id="ecran3" class="carte cache">
  <h2 id="titre3">Bravo !</h2>
  <p id="score" style="font-size:1.5em;"></p>
  <button class="btn jaune" onclick="retour()">🔄 Rejouer</button>
</div>

<script>
var niveaux = [
  [
    { avant: 'Il ', apres: ' un chat.', bonne: 'a', mauvaise: 'à', expl: 'a = verbe avoir' },
    { avant: 'Je vais ', apres: ' Paris.', bonne: 'à', mauvaise: 'a', expl: 'à = préposition' },
    { avant: 'Elle ', apres: ' fini.', bonne: 'a', mauvaise: 'à', expl: 'a = verbe avoir' },
    { avant: 'Il pense ', apres: ' ses vacances.', bonne: 'à', mauvaise: 'a', expl: 'à = préposition' },
    { avant: 'Le chat ', apres: ' le chien jouent.', bonne: 'et', mauvaise: 'est', expl: 'et = addition' },
    { avant: 'Il ', apres: ' content.', bonne: 'est', mauvaise: 'et', expl: 'est = verbe être' },
    { avant: 'Papa ', apres: ' maman sont là.', bonne: 'et', mauvaise: 'est', expl: 'et = addition' },
    { avant: 'La fleur ', apres: ' belle.', bonne: 'est', mauvaise: 'et', expl: 'est = verbe être' },
    { avant: "J'aime le pain ", apres: ' le fromage.', bonne: 'et', mauvaise: 'est', expl: 'et = addition' },
    { avant: 'Tom ', apres: ' un vélo.', bonne: 'a', mauvaise: 'à', expl: 'a = verbe avoir' }
  ],
  [
    { avant: 'Tu veux du thé ', apres: ' du café ?', bonne: 'ou', mauvaise: 'où', expl: 'ou = choix' },
    { avant: 'Je sais ', apres: ' il habite.', bonne: 'où', mauvaise: 'ou', expl: 'où = lieu' },
    { avant: 'Tu préfères le rouge ', apres: ' le bleu ?', bonne: 'ou', mauvaise: 'où', expl: 'ou = choix' },
    { avant: "C'est la maison ", apres: ' je suis né.', bonne: 'où', mauvaise: 'ou', expl: 'où = lieu' },
    { avant: 'Il a oublié ', apres: ' cartable.', bonne: 'son', mauvaise: 'sont', expl: 'son = déterminant' },
    { avant: 'Ils ', apres: ' partis.', bonne: 'sont', mauvaise: 'son', expl: 'sont = verbe être' },
    { avant: 'Elle range ', apres: ' livre.', bonne: 'son', mauvaise: 'sont', expl: 'son = déterminant' },
    { avant: 'Les enfants ', apres: ' contents.', bonne: 'sont', mauvaise: 'son', expl: 'sont = verbe être' },
    { avant: 'Il joue avec ', apres: ' chien.', bonne: 'son', mauvaise: 'sont', expl: 'son = déterminant' },
    { avant: 'Mes amis ', apres: ' arrivés.', bonne: 'sont', mauvaise: 'son', expl: 'sont = verbe être' }
  ],
  [
    { avant: 'Les enfants ', apres: ' faim.', bonne: 'ont', mauvaise: 'on', expl: 'ont = verbe avoir' },
    { avant: '', apres: ' va à la plage.', bonne: 'On', mauvaise: 'Ont', expl: 'on = pronom' },
    { avant: 'Ils ', apres: ' gagné.', bonne: 'ont', mauvaise: 'on', expl: 'ont = verbe avoir' },
    { avant: '', apres: ' mange à midi.', bonne: 'On', mauvaise: 'Ont', expl: 'on = pronom' },
    { avant: 'Elles ', apres: ' acheté des fleurs.', bonne: 'ont', mauvaise: 'on', expl: 'ont = verbe avoir' },
    { avant: 'Le chat ', apres: ' le chien dorment.', bonne: 'et', mauvaise: 'est', expl: 'et = addition' },
    { avant: 'Elle ', apres: ' partie.', bonne: 'est', mauvaise: 'et', expl: 'est = verbe être' },
    { avant: 'Il est allé ', apres: ' la mer.', bonne: 'à', mauvaise: 'a', expl: 'à = préposition' },
    { avant: 'Léa ', apres: ' un nouveau sac.', bonne: 'a', mauvaise: 'à', expl: 'a = verbe avoir' },
    { avant: 'Ils ', apres: ' tout compris.', bonne: 'ont', mauvaise: 'on', expl: 'ont = verbe avoir' }
  ]
];

var liste = [];
var idx = 0;
var score = 0;
var phraseActuelle = null;
var choixA = '';
var choixB = '';

function demarrer(numNiveau) {
  liste = niveaux[numNiveau].slice();
  // Mélanger
  for (var i = liste.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = liste[i]; liste[i] = liste[j]; liste[j] = t;
  }
  idx = 0;
  score = 0;
  document.getElementById('ecran1').style.display = 'none';
  document.getElementById('ecran2').style.display = 'block';
  document.getElementById('ecran3').style.display = 'none';
  afficher();
}

function afficher() {
  if (idx >= liste.length) {
    document.getElementById('ecran2').style.display = 'none';
    document.getElementById('ecran3').style.display = 'block';
    document.getElementById('score').textContent = score + ' / ' + liste.length + ' bonnes réponses';
    if (score === liste.length) document.getElementById('titre3').textContent = '🏆 PARFAIT !';
    else if (score >= 7) document.getElementById('titre3').textContent = '🎉 TRÈS BIEN !';
    else if (score >= 5) document.getElementById('titre3').textContent = '👍 PAS MAL !';
    else document.getElementById('titre3').textContent = '💪 COURAGE !';
    return;
  }
  phraseActuelle = liste[idx];
  document.getElementById('num').textContent = (idx + 1);
  document.getElementById('phrase').innerHTML = phraseActuelle.avant + ' <span class="trou">?</span> ' + phraseActuelle.apres;
  
  choixA = phraseActuelle.bonne;
  choixB = phraseActuelle.mauvaise;
  if (Math.random() < 0.5) {
    choixA = phraseActuelle.mauvaise;
    choixB = phraseActuelle.bonne;
  }
  document.getElementById('btnA').textContent = choixA;
  document.getElementById('btnB').textContent = choixB;
  document.getElementById('btnA').disabled = false;
  document.getElementById('btnB').disabled = false;
  document.getElementById('btnA').style.background = '#3b82f6';
  document.getElementById('btnB').style.background = '#3b82f6';
  document.getElementById('msg').className = 'msg info';
  document.getElementById('msg').textContent = '👆 Clique sur le bon mot !';
}

function cliqueA() { verifier(choixA, 'btnA'); }
function cliqueB() { verifier(choixB, 'btnB'); }

function verifier(choix, boutonId) {
  document.getElementById('btnA').disabled = true;
  document.getElementById('btnB').disabled = true;
  
  var msg = document.getElementById('msg');
  if (choix === phraseActuelle.bonne) {
    score++;
    document.getElementById(boutonId).style.background = '#22c55e';
    msg.className = 'msg ok';
    msg.textContent = '✅ Bravo ! ' + phraseActuelle.expl;
  } else {
    document.getElementById(boutonId).style.background = '#ef4444';
    msg.className = 'msg ko';
    msg.textContent = '❌ Presque ! C\'était "' + phraseActuelle.bonne + '". ' + phraseActuelle.expl;
    if (choixA === phraseActuelle.bonne) document.getElementById('btnA').style.background = '#22c55e';
    if (choixB === phraseActuelle.bonne) document.getElementById('btnB').style.background = '#22c55e';
  }
  
  idx++;
  setTimeout(afficher, 2200);
}

function retour() {
  document.getElementById('ecran1').style.display = 'block';
  document.getElementById('ecran2').style.display = 'none';
  document.getElementById('ecran3').style.display = 'none';
}
</script>

</body>
</html>
