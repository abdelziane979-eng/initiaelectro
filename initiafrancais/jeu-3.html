<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Les Conjugaisons (Présent) - InitiaFrançais</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #dcfce7; margin: 0; }
  .carte { background: white; padding: 20px; border-radius: 15px; max-width: 600px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1 { color: #166534; }
  .btn { padding: 15px 30px; font-size: 1.2em; margin: 10px; cursor: pointer; border: none; border-radius: 10px; color: white; font-weight: bold; font-family: inherit; }
  .btn:hover { opacity: 0.9; }
  .vert { background: #22c55e; }
  .jaune { background: #f59e0b; }
  .rouge { background: #ef4444; }
  .prop { background: #3b82f6; padding: 20px 40px; font-size: 1.5em; margin: 10px; cursor: pointer; border: none; border-radius: 10px; color: white; font-weight: bold; font-family: inherit; min-width: 150px; }
  .prop:hover { opacity: 0.9; }
  .prop:disabled { cursor: not-allowed; }
  .phrase { font-size: 1.6em; font-weight: bold; margin: 20px 0; padding: 20px; background: #fef3c7; border-radius: 10px; }
  .pronom { color: #166534; }
  .verbe { color: #1d4ed8; font-style: italic; }
  .msg { padding: 15px; border-radius: 10px; margin: 15px 0; font-weight: bold; min-height: 50px; }
  .info { background: #dbeafe; color: #1e40af; }
  .ok { background: #dcfce7; color: #166534; }
  .ko { background: #fee2e2; color: #991b1b; }
  .cache { display: none; }
</style>
</head>
<body>

<div id="ecran1" class="carte">
  <h1>🎯 Les Conjugaisons (Présent)</h1>
  <p>Choisis ton niveau :</p>
  <button class="btn vert" onclick="demarrer(0)">🟢 Facile (-ER, être, avoir)</button>
  <button class="btn jaune" onclick="demarrer(1)">🟡 Moyen (-IR, aller, faire)</button>
  <button class="btn rouge" onclick="demarrer(2)">🔴 Difficile (verbes irréguliers)</button>
  <br><a href="index.html" style="display:inline-block;margin-top:15px;color:#64748b;">← Retour aux jeux</a>
</div>

<div id="ecran2" class="carte cache">
  <p><span id="num">1</span> / 10</p>
  <div class="phrase">
    <span class="pronom" id="pronom">Je</span> <span id="trou">___</span><br>
    <span class="verbe" id="infinitif">(chanter)</span>
  </div>
  <button class="prop" id="btnA" onclick="cliqueA()">A</button>
  <button class="prop" id="btnB" onclick="cliqueB()">B</button>
  <div class="msg info" id="msg">Clique sur la bonne conjugaison !</div>
  <a href="index.html" style="display:inline-block;margin-top:15px;color:#64748b;">← Retour</a>
</div>

<div id="ecran3" class="carte cache">
  <h2 id="titre3">Bravo !</h2>
  <p id="score" style="font-size:1.5em;"></p>
  <button class="btn jaune" onclick="retour()">🔄 Rejouer</button>
</div>

<script>
var niveaux = [
  // NIVEAU FACILE : verbes en -ER, être, avoir
  [
    { pron: 'Je', inf: 'chanter', bonne: 'chante', mauvaise: 'chantes', expl: 'Je chante (verbe en -ER : -e à la 1ère personne).' },
    { pron: 'Tu', inf: 'chanter', bonne: 'chantes', mauvaise: 'chante', expl: 'Tu chantes (verbe en -ER : -es à la 2e personne).' },
    { pron: 'Il', inf: 'chanter', bonne: 'chante', mauvaise: 'chantes', expl: 'Il chante (verbe en -ER : -e à la 3e personne).' },
    { pron: 'Nous', inf: 'chanter', bonne: 'chantons', mauvaise: 'chantez', expl: 'Nous chantons (verbe en -ER : -ons à la 1ère pers. du pluriel).' },
    { pron: 'Vous', inf: 'chanter', bonne: 'chantez', mauvaise: 'chantons', expl: 'Vous chantez (verbe en -ER : -ez à la 2e pers. du pluriel).' },
    { pron: 'Ils', inf: 'chanter', bonne: 'chantent', mauvaise: 'chantes', expl: 'Ils chantent (verbe en -ER : -ent à la 3e pers. du pluriel).' },
    { pron: 'Je', inf: 'être', bonne: 'suis', mauvaise: 'es', expl: 'Je suis (verbe être, irrégulier).' },
    { pron: 'Tu', inf: 'être', bonne: 'es', mauvaise: 'suis', expl: 'Tu es (verbe être, irrégulier).' },
    { pron: 'Il', inf: 'être', bonne: 'est', mauvaise: 'es', expl: 'Il est (verbe être, irrégulier).' },
    { pron: 'Nous', inf: 'avoir', bonne: 'avons', mauvaise: 'avez', expl: 'Nous avons (verbe avoir).' }
  ],
  // NIVEAU MOYEN : verbes en -IR, aller, faire, prendre
  [
    { pron: 'Je', inf: 'finir', bonne: 'finis', mauvaise: 'finit', expl: 'Je finis (verbe en -IR : -is à la 1ère personne).' },
    { pron: 'Tu', inf: 'finir', bonne: 'finis', mauvaise: 'finis', expl: 'Tu finis (verbe en -IR : -is à la 2e personne).' },
    { pron: 'Il', inf: 'finir', bonne: 'finit', mauvaise: 'finis', expl: 'Il finit (verbe en -IR : -it à la 3e personne).' },
    { pron: 'Nous', inf: 'finir', bonne: 'finissons', mauvaise: 'finissez', expl: 'Nous finissons (verbe en -IR : -issons).' },
    { pron: 'Vous', inf: 'finir', bonne: 'finissez', mauvaise: 'finissons', expl: 'Vous finissez (verbe en -IR : -issez).' },
    { pron: 'Ils', inf: 'finir', bonne: 'finissent', mauvaise: 'finis', expl: 'Ils finissent (verbe en -IR : -issent).' },
    { pron: 'Je', inf: 'aller', bonne: 'vais', mauvaise: 'vas', expl: 'Je vais (verbe aller, irrégulier).' },
    { pron: 'Tu', inf: 'aller', bonne: 'vas', mauvaise: 'vais', expl: 'Tu vas (verbe aller, irrégulier).' },
    { pron: 'Il', inf: 'faire', bonne: 'fait', mauvaise: 'fais', expl: 'Il fait (verbe faire, irrégulier).' },
    { pron: 'Nous', inf: 'aller', bonne: 'allons', mauvaise: 'allez', expl: 'Nous allons (verbe aller).' }
  ],
  // NIVEAU DIFFICILE : verbes irréguliers
  [
    { pron: 'Je', inf: 'pouvoir', bonne: 'peux', mauvaise: 'peut', expl: 'Je peux (verbe pouvoir).' },
    { pron: 'Tu', inf: 'vouloir', bonne: 'veux', mauvaise: 'veut', expl: 'Tu veux (verbe vouloir).' },
    { pron: 'Il', inf: 'venir', bonne: 'vient', mauvaise: 'viens', expl: 'Il vient (verbe venir).' },
    { pron: 'Nous', inf: 'voir', bonne: 'voyons', mauvaise: 'voulez', expl: 'Nous voyons (verbe voir).' },
    { pron: 'Vous', inf: 'dire', bonne: 'dites', mauvaise: 'disez', expl: 'Vous dites (verbe dire, irrégulier à la 2e pers. du pluriel).' },
    { pron: 'Ils', inf: 'pouvoir', bonne: 'peuvent', mauvaise: 'peuvent pas', expl: 'Ils peuvent (verbe pouvoir).' },
    { pron: 'Je', inf: 'vouloir', bonne: 'veux', mauvaise: 'voulez', expl: 'Je veux (verbe vouloir).' },
    { pron: 'Tu', inf: 'voir', bonne: 'vois', mauvaise: 'voit', expl: 'Tu vois (verbe voir).' },
    { pron: 'Il', inf: 'dire', bonne: 'dit', mauvaise: 'dis', expl: 'Il dit (verbe dire).' },
    { pron: 'Nous', inf: 'venir', bonne: 'venons', mauvaise: 'venez', expl: 'Nous venons (verbe venir).' }
  ]
];

var liste = [];
var idx = 0;
var score = 0;
var questionActuelle = null;
var choixA = '';
var choixB = '';

function demarrer(numNiveau) {
  liste = niveaux[numNiveau].slice();
  for (var i = liste.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = liste[i]; liste[i] = liste[j]; liste[j] = t;
  }
  idx = 0;
  score = 0;
  document.getElementById('ecran1').style.display = 'none';
  document.getElementById('ecran2').style.display = 'block';
  document.getElementById('ecran3').style.display = 'none';
  afficher();
}

function afficher() {
  if (idx >= liste.length) {
    document.getElementById('ecran2').style.display = 'none';
    document.getElementById('ecran3').style.display = 'block';
    document.getElementById('score').textContent = score + ' / ' + liste.length + ' bonnes réponses';
    if (score === liste.length) document.getElementById('titre3').textContent = '🏆 PARFAIT !';
    else if (score >= 7) document.getElementById('titre3').textContent = '🎉 TRÈS BIEN !';
    else if (score >= 5) document.getElementById('titre3').textContent = '👍 PAS MAL !';
    else document.getElementById('titre3').textContent = '💪 COURAGE !';
    return;
  }
  questionActuelle = liste[idx];
  document.getElementById('num').textContent = (idx + 1);
  document.getElementById('pronom').textContent = questionActuelle.pron;
  document.getElementById('infinitif').textContent = '(' + questionActuelle.inf + ')';
  
  choixA = questionActuelle.bonne;
  choixB = questionActuelle.mauvaise;
  if (Math.random() < 0.5) {
    choixA = questionActuelle.mauvaise;
    choixB = questionActuelle.bonne;
  }
  document.getElementById('btnA').textContent = choixA;
  document.getElementById('btnB').textContent = choixB;
  document.getElementById('btnA').disabled = false;
  document.getElementById('btnB').disabled = false;
  document.getElementById('btnA').style.background = '#3b82f6';
  document.getElementById('btnB').style.background = '#3b82f6';
  document.getElementById('msg').className = 'msg info';
  document.getElementById('msg').textContent = '👆 Clique sur la bonne conjugaison !';
}

function cliqueA() { verifier(choixA, 'btnA'); }
function cliqueB() { verifier(choixB, 'btnB'); }

function verifier(choix, boutonId) {
  document.getElementById('btnA').disabled = true;
  document.getElementById('btnB').disabled = true;
  
  var msg = document.getElementById('msg');
  if (choix === questionActuelle.bonne) {
    score++;
    document.getElementById(boutonId).style.background = '#22c55e';
    msg.className = 'msg ok';
    msg.textContent = '✅ Bravo ! ' + questionActuelle.expl;
  } else {
    document.getElementById(boutonId).style.background = '#ef4444';
    msg.className = 'msg ko';
    msg.textContent = '❌ Presque ! C\'était "' + questionActuelle.bonne + '". ' + questionActuelle.expl;
    if (choixA === questionActuelle.bonne) document.getElementById('btnA').style.background = '#22c55e';
    if (choixB === questionActuelle.bonne) document.getElementById('btnB').style.background = '#22c55e';
  }
  
  idx++;
  setTimeout(afficher, 2500);
}

function retour() {
  document.getElementById('ecran1').style.display = 'block';
  document.getElementById('ecran2').style.display = 'none';
  document.getElementById('ecran3').style.display = 'none';
}
</script>

</body>
</html>
