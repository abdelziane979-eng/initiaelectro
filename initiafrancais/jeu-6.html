<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Masculin ou Féminin - InitiaFrançais</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fce7f3; margin: 0; }
  .carte { background: white; padding: 20px; border-radius: 15px; max-width: 600px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1 { color: #9d174d; }
  .btn { padding: 15px 30px; font-size: 1.2em; margin: 10px; cursor: pointer; border: none; border-radius: 10px; color: white; font-weight: bold; font-family: inherit; }
  .btn:hover { opacity: 0.9; }
  .vert { background: #22c55e; }
  .jaune { background: #f59e0b; }
  .rouge { background: #ef4444; }
  .prop { background: #3b82f6; padding: 20px 40px; font-size: 1.6em; margin: 10px; cursor: pointer; border: none; border-radius: 10px; color: white; font-weight: bold; font-family: inherit; min-width: 180px; }
  .prop:hover { opacity: 0.9; }
  .prop:disabled { cursor: not-allowed; }
  .phrase { font-size: 1.4em; font-weight: bold; margin: 20px 0; padding: 20px; background: #fef3c7; border-radius: 10px; }
  .mot { color: #9d174d; font-size: 1.8em; letter-spacing: 1px; }
  .consigne { font-size: 1em; color: #831843; margin-bottom: 10px; font-weight: normal; }
  .emoji { font-size: 4em; margin: 10px 0; }
  .msg { padding: 15px; border-radius: 10px; margin: 15px 0; font-weight: bold; min-height: 50px; }
  .info { background: #dbeafe; color: #1e40af; }
  .ok { background: #dcfce7; color: #166534; }
  .ko { background: #fee2e2; color: #991b1b; }
  .cache { display: none; }
</style>
</head>
<body>

<div id="ecran1" class="carte">
  <h1>⚥ Masculin ou Féminin</h1>
  <p>Choisis ton niveau :</p>
  <button class="btn vert" onclick="demarrer(0)">🟢 Facile (UN / UNE)</button>
  <button class="btn jaune" onclick="demarrer(1)">🟡 Moyen (LE / LA)</button>
  <button class="btn rouge" onclick="demarrer(2)">🔴 Difficile (accords)</button>
  <br><a href="index.html" style="display:inline-block;margin-top:15px;color:#64748b;">← Retour aux jeux</a>
</div>

<div id="ecran2" class="carte cache">
  <p><span id="num">1</span> / 10</p>
  <div class="phrase">
    <div class="consigne" id="consigne">Choisis le bon article :</div>
    <div class="emoji" id="emoji">🐱</div>
    <span class="mot" id="mot">chat</span>
  </div>
  <button class="prop" id="btnA" onclick="cliqueA()">A</button>
  <button class="prop" id="btnB" onclick="cliqueB()">B</button>
  <div class="msg info" id="msg">Clique sur la bonne réponse !</div>
  <a href="index.html" style="display:inline-block;margin-top:15px;color:#64748b;">← Retour</a>
</div>

<div id="ecran3" class="carte cache">
  <h2 id="titre3">Bravo !</h2>
  <p id="score" style="font-size:1.5em;"></p>
  <button class="btn jaune" onclick="retour()">🔄 Rejouer</button>
</div>

<script>
var niveaux = [
  // NIVEAU FACILE : UN / UNE
  [
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🐱', mot: 'chat', bonne: 'un', mauvaise: 'une', expl: 'On dit UN chat (masculin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🌸', mot: 'fleur', bonne: 'une', mauvaise: 'un', expl: 'On dit UNE fleur (féminin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '📖', mot: 'livre', bonne: 'un', mauvaise: 'une', expl: 'On dit UN livre (masculin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🏠', mot: 'maison', bonne: 'une', mauvaise: 'un', expl: 'On dit UNE maison (féminin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🍎', mot: 'fruit', bonne: 'un', mauvaise: 'une', expl: 'On dit UN fruit (masculin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🚗', mot: 'voiture', bonne: 'une', mauvaise: 'un', expl: 'On dit UNE voiture (féminin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🌳', mot: 'arbre', bonne: 'un', mauvaise: 'une', expl: 'On dit UN arbre (masculin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🍽️', mot: 'table', bonne: 'une', mauvaise: 'un', expl: 'On dit UNE table (féminin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '🐶', mot: 'chien', bonne: 'un', mauvaise: 'une', expl: 'On dit UN chien (masculin).' },
    { consigne: 'Choisis le bon article (UN ou UNE) :', emoji: '⭐', mot: 'étoile', bonne: 'une', mauvaise: 'un', expl: 'On dit UNE étoile (féminin).' }
  ],
  // NIVEAU MOYEN : LE / LA
  [
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '☀️', mot: 'soleil', bonne: 'le', mauvaise: 'la', expl: 'On dit LE soleil (masculin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '🌙', mot: 'lune', bonne: 'la', mauvaise: 'le', expl: 'On dit LA lune (féminin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '🎵', mot: 'musique', bonne: 'la', mauvaise: 'le', expl: 'On dit LA musique (féminin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '🌊', mot: 'océan', bonne: 'le', mauvaise: 'la', expl: 'On dit LE océan / L\'océan (masculin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '💡', mot: 'lumière', bonne: 'la', mauvaise: 'le', expl: 'On dit LA lumière (féminin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '🐟', mot: 'poisson', bonne: 'le', mauvaise: 'la', expl: 'On dit LE poisson (masculin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '🧀', mot: 'fromage', bonne: 'le', mauvaise: 'la', expl: 'On dit LE fromage (masculin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '🍰', mot: 'tarte', bonne: 'la', mauvaise: 'le', expl: 'On dit LA tarte (féminin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '🎨', mot: 'tableau', bonne: 'le', mauvaise: 'la', expl: 'On dit LE tableau (masculin).' },
    { consigne: 'Choisis le bon article (LE ou LA) :', emoji: '📝', mot: 'page', bonne: 'la', mauvaise: 'le', expl: 'On dit LA page (féminin).' }
  ],
  // NIVEAU DIFFICILE : accords
  [
    { consigne: 'Complète l\'accord (petit / petite) :', emoji: '🐱', mot: 'La ___ fille', bonne: 'petite', mauvaise: 'petit', expl: 'Fille est féminin, donc "petite".' },
    { consigne: 'Complète l\'accord (petit / petite) :', emoji: '👦', mot: 'Le ___ garçon', bonne: 'petit', mauvaise: 'petite', expl: 'Garçon est masculin, donc "petit".' },
    { consigne: 'Complète l\'accord (grand / grande) :', emoji: '🏠', mot: 'Une ___ maison', bonne: 'grande', mauvaise: 'grand', expl: 'Maison est féminin, donc "grande".' },
    { consigne: 'Complète l\'accord (grand / grande) :', emoji: '🏰', mot: 'Un ___ château', bonne: 'grand', mauvaise: 'grande', expl: 'Château est masculin, donc "grand".' },
    { consigne: 'Complète l\'accord (beau / belle) :', emoji: '🌸', mot: 'Une ___ fleur', bonne: 'belle', mauvaise: 'beau', expl: 'Fleur est féminin, donc "belle".' },
    { consigne: 'Complète l\'accord (beau / belle) :', emoji: '🌅', mot: 'Un ___ coucher', bonne: 'beau', mauvaise: 'belle', expl: 'Coucher est masculin, donc "beau".' },
    { consigne: 'Complète l\'accord (heureux / heureuse) :', emoji: '😊', mot: 'Elle est ___', bonne: 'heureuse', mauvaise: 'heureux', expl: 'Elle est féminin, donc "heureuse".' },
    { consigne: 'Complète l\'accord (heureux / heureuse) :', emoji: '😄', mot: 'Il est ___', bonne: 'heureux', mauvaise: 'heureuse', expl: 'Il est masculin, donc "heureux".' },
    { consigne: 'Complète l\'accord (content / contente) :', emoji: '👩', mot: 'La dame est ___', bonne: 'contente', mauvaise: 'content', expl: 'Dame est féminin, donc "contente".' },
    { consigne: 'Complète l\'accord (content / contente) :', emoji: '👦', mot: 'Le garçon est ___', bonne: 'content', mauvaise: 'contente', expl: 'Garçon est masculin, donc "content".' }
  ]
];

var liste = [];
var idx = 0;
var score = 0;
var questionActuelle = null;
var choixA = '';
var choixB = '';

function demarrer(numNiveau) {
  liste = niveaux[numNiveau].slice();
  for (var i = liste.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = liste[i]; liste[i] = liste[j]; liste[j] = t;
  }
  idx = 0;
  score = 0;
  document.getElementById('ecran1').style.display = 'none';
  document.getElementById('ecran2').style.display = 'block';
  document.getElementById('ecran3').style.display = 'none';
  afficher();
}

function afficher() {
  if (idx >= liste.length) {
    document.getElementById('ecran2').style.display = 'none';
    document.getElementById('ecran3').style.display = 'block';
    document.getElementById('score').textContent = score + ' / ' + liste.length + ' bonnes réponses';
    if (score === liste.length) document.getElementById('titre3').textContent = '🏆 PARFAIT !';
    else if (score >= 7) document.getElementById('titre3').textContent = '🎉 TRÈS BIEN !';
    else if (score >= 5) document.getElementById('titre3').textContent = '👍 PAS MAL !';
    else document.getElementById('titre3').textContent = '💪 COURAGE !';
    return;
  }
  questionActuelle = liste[idx];
  document.getElementById('num').textContent = (idx + 1);
  document.getElementById('consigne').textContent = questionActuelle.consigne;
  document.getElementById('emoji').textContent = questionActuelle.emoji;
  document.getElementById('mot').textContent = questionActuelle.mot;
  
  choixA = questionActuelle.bonne;
  choixB = questionActuelle.mauvaise;
  if (Math.random() < 0.5) {
    choixA = questionActuelle.mauvaise;
    choixB = questionActuelle.bonne;
  }
  document.getElementById('btnA').textContent = choixA;
  document.getElementById('btnB').textContent = choixB;
  document.getElementById('btnA').disabled = false;
  document.getElementById('btnB').disabled = false;
  document.getElementById('btnA').style.background = '#3b82f6';
  document.getElementById('btnB').style.background = '#3b82f6';
  document.getElementById('msg').className = 'msg info';
  document.getElementById('msg').textContent = '👆 Clique sur la bonne réponse !';
}

function cliqueA() { verifier(choixA, 'btnA'); }
function cliqueB() { verifier(choixB, 'btnB'); }

function verifier(choix, boutonId) {
  document.getElementById('btnA').disabled = true;
  document.getElementById('btnB').disabled = true;
  
  var msg = document.getElementById('msg');
  if (choix === questionActuelle.bonne) {
    score++;
    document.getElementById(boutonId).style.background = '#22c55e';
    msg.className = 'msg ok';
    msg.textContent = '✅ Bravo ! ' + questionActuelle.expl;
  } else {
    document.getElementById(boutonId).style.background = '#ef4444';
    msg.className = 'msg ko';
    msg.textContent = '❌ Presque ! C\'était "' + questionActuelle.bonne + '". ' + questionActuelle.expl;
    if (choixA === questionActuelle.bonne) document.getElementById('btnA').style.background = '#22c55e';
    if (choixB === questionActuelle.bonne) document.getElementById('btnB').style.background = '#22c55e';
  }
  
  idx++;
  setTimeout(afficher, 2500);
}

function retour() {
  document.getElementById('ecran1').style.display = 'block';
  document.getElementById('ecran2').style.display = 'none';
  document.getElementById('ecran3').style.display = 'none';
}
</script>

</body>
</html>
