<script>
var niveauChoisi = 'facile';
var questions = [];
var indexQuestion = 0;
var bonnesReponses = 0;
var NB_QUESTIONS = 10;
var audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function jouerSon(frequence, duree, type) {
  initAudio();
  if (!audioCtx) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = frequence;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duree);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duree);
  } catch(e) {}
}

function jouerSucces() {
  jouerSon(523, 0.1, 'sine');
  setTimeout(function(){ jouerSon(659, 0.1, 'sine'); }, 100);
  setTimeout(function(){ jouerSon(784, 0.2, 'sine'); }, 200);
}

function jouerEchec() {
  jouerSon(300, 0.15, 'square');
  setTimeout(function(){ jouerSon(200, 0.25, 'square'); }, 150);
}

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function formatPrix(prix) {
  return prix.toFixed(2).replace('.', ',') + ' €';
}

// ============================================================
// GÉNÉRATION DES QUESTIONS
// ============================================================

var BOUTIQUES = {

    emoji: '🥖',
    articles: [
      { emoji: '🥖', nom: 'une baguette', prix: function(){ return rand(1, 2); } },
      { emoji: '🥐', nom: 'un croissant', prix: function(){ return rand(1, 2); } },
      { emoji: '🍫', nom: 'un pain au chocolat', prix: function(){ return rand(1, 2); } },
      { emoji: '🥧', nom: 'une tartelette', prix: function(){ return rand(2, 3); } },
      { emoji: '🍞', nom: 'un pain de mie', prix: function(){ return rand(2, 4); } },

    ]
  },
  epicerie: {

    emoji: '🛒',
    articles: [
      { emoji: '🍎', nom: 'une pomme', prix: function(){ return rand(1, 2); } },
      { emoji: '🍌', nom: 'une banane', prix: function(){ return rand(1, 2); } },
      { emoji: '🥛', nom: 'une brique de lait', prix: function(){ return rand(1, 3); } },
      { emoji: '🧀', nom: 'un morceau de fromage', prix: function(){ return rand(2, 4); } },
      { emoji: '🍫', nom: 'une tablette de chocolat', prix: function(){ return rand(1, 3); } },
      { emoji: '🧃', nom: 'une brique de jus', prix: function(){ return rand(1, 3); } }
    ]
  },
  papeterie: {
    nom: 'la papeterie',
    emoji: '✏️',
    articles: [
      { emoji: '✏️', nom: 'un crayon', prix: function(){ return rand(1, 2); } },
      { emoji: '📓', nom: 'un cahier', prix: function(){ return rand(1, 3); } },
      { emoji: '🖊️', nom: 'un stylo', prix: function(){ return rand(1, 2); } },
      { emoji: '📏', nom: 'une règle', prix: function(){ return rand(1, 2); } },
      { emoji: '🧽', nom: 'une gomme', prix: function(){ return rand(1, 2); } },
      { emoji: '🖍️', nom: 'un feutre', prix: function(){ return rand(1, 2); } }
    ]
  },
  primeur: {
    nom: 'le primeur',
    emoji: '🍎',
    articles: [
      { emoji: '🍎', nom: 'une pomme', prix: function(){ return rand(1, 2); } },
      { emoji: '🍐', nom: 'une poire', prix: function(){ return rand(1, 2); } },
      { emoji: '🍅', nom: 'une tomate', prix: function(){ return rand(1, 2); } },
      { emoji: '🥕', nom: 'une carotte', prix: function(){ return rand(1, 2); } },
      { emoji: '🥔', nom: 'une pomme de terre', prix: function(){ return rand(1, 1); } },
      { emoji: '🍇', nom: 'une grappe de raisin', prix: function(){ return rand(2, 3); } }
    ]
  }
};

var OBJETS_MOYEN = [
  { emoji: '🎮', nom: 'un jeu vidéo', prix: function(){ return rand(15, 45); } },
  { emoji: '📚', nom: 'un livre', prix: function(){ return rand(8, 20); } },
  { emoji: '👕', nom: 'un t-shirt', prix: function(){ return rand(10, 25); } },
  { emoji: '🎒', nom: 'un sac', prix: function(){ return rand(12, 30); } },
  { emoji: '⚽', nom: 'un ballon', prix: function(){ return rand(8, 22); } },
  { emoji: '🧸', nom: 'une peluche', prix: function(){ return rand(10, 25); } },
  { emoji: '🎧', nom: 'des écouteurs', prix: function(){ return rand(15, 35); } },
  { emoji: '👟', nom: 'une paire de chaussures', prix: function(){ return rand(20, 40); } }
];

var OBJETS_DIFFICILE = [
  { emoji: '🍕', nom: 'une pizza', prix: function(){ return rand(8, 15); } },
  { emoji: '🍔', nom: 'un burger', prix: function(){ return rand(6, 12); } },
  { emoji: '🥤', nom: 'une boisson', prix: function(){ return rand(2, 5); } },
  { emoji: '🍟', nom: 'des frites', prix: function(){ return rand(3, 6); } },
  { emoji: '🍰', nom: 'un dessert', prix: function(){ return rand(4, 8); } },
  { emoji: '🍿', nom: 'du pop-corn', prix: function(){ return rand(3, 6); } }
];

function genererQuestion(niveau) {
  if (niveau === 'facile') {
    return genererFacile();
  } else if (niveau === 'moyen') {
    return genererMoyen();
  } else {
    return genererDifficile();
  }
}

function genererFacile() {
  // Total de 2 articles
  var nbArticles = rand(2, 3);
  var articles = [];
  var total = 0;
  var detail = '';
  
  for (var i = 0; i < nbArticles; i++) {
    var obj = OBJETS_FACILE[rand(0, OBJETS_FACILE.length - 1)];
    var prix = obj.prix();
    articles.push({ emoji: obj.emoji, nom: obj.nom, prix: prix });
    total += prix;
    detail += '<div>' + obj.emoji + ' ' + obj.nom + ' : ' + formatPrix(prix) + '</div>';
  }
  
  var scenario = 'Tu vas à la boulangerie et tu achètes ' + nbArticles + ' articles :';
  
  return {
    emoji: '🛒',
    scenario: scenario,
    detail: detail,
    question: 'Quel est le TOTAL à payer ?',
    bonneReponse: total,
    bonneReponseTexte: formatPrix(total),
    propositions: genererPropositionsPrix(total, 1, 15),
    unite: '€'
  };
}

function genererMoyen() {
  // Rendre la monnaie
  var obj = OBJETS_MOYEN[rand(0, OBJETS_MOYEN.length - 1)];
  var prix = obj.prix();
  
  // Billets possibles
  var billets = [20, 50, 100];
  var billet = billets[0];
  for (var i = 0; i < billets.length; i++) {
    if (billets[i] > prix) { billet = billets[i]; break; }
  }
  
  var monnaie = billet - prix;
  var detail = '<div>' + obj.emoji + ' ' + obj.nom + ' : ' + formatPrix(prix) + '</div>';
  detail += '<div>💵 Tu payes avec un billet de ' + billet + ' €</div>';
  
  var scenario = 'Tu achètes ' + obj.nom + ' qui coûte ' + formatPrix(prix) + '.';
  
  return {
    emoji: '💵',
    scenario: scenario,
    detail: detail,
    question: 'Combien de monnaie doit-on te rendre ?',
    bonneReponse: monnaie,
    bonneReponseTexte: formatPrix(monnaie),
    propositions: genererPropositionsPrix(monnaie, 1, 50),
    unite: '€'
  };
}

function genererDifficile() {
  // Plusieurs articles + remise
  var articles = [];
  var total = 0;
  var detail = '';
  var nbArticles = rand(2, 3);
  
  for (var i = 0; i < nbArticles; i++) {
    var obj = OBJETS_DIFFICILE[rand(0, OBJETS_DIFFICILE.length - 1)];
    var prix = obj.prix();
    var quantite = rand(1, 2);
    var sousTotal = prix * quantite;
    articles.push({ emoji: obj.emoji, nom: obj.nom, prix: prix, quantite: quantite });
    total += sousTotal;
    if (quantite === 1) {
      detail += '<div>' + obj.emoji + ' ' + obj.nom + ' : ' + formatPrix(prix) + '</div>';
    } else {
      detail += '<div>' + obj.emoji + ' ' + quantite + ' × ' + obj.nom + ' : ' + formatPrix(prix) + ' × ' + quantite + ' = ' + formatPrix(sousTotal) + '</div>';
    }
  }
  
  var remise = 0;
  var questionText = 'Quel est le TOTAL à payer ?';
  var totalFinal = total;
  
  // 50% de chance d'avoir une remise
  if (Math.random() < 0.5 && total > 10) {
    remise = Math.round(total * 0.1); // 10% de remise
    totalFinal = total - remise;
    detail += '<div>🎁 Remise fidélité : -' + formatPrix(remise) + '</div>';
    questionText = 'Quel est le total APRÈS la remise de 10% ?';
  }
  
  var scenario = 'Tu passes une commande au restaurant :';
  
  return {
    emoji: '🍽️',
    scenario: scenario,
    detail: detail,
    question: questionText,
    bonneReponse: totalFinal,
    bonneReponseTexte: formatPrix(totalFinal),
    propositions: genererPropositionsPrix(totalFinal, 1, 50),
    unite: '€'
  };
}

function genererPropositionsPrix(bonne, minOffset, maxOffset) {
  var propositions = [bonne];
  var tentatives = 0;
  
  while (propositions.length < 4 && tentatives < 200) {
    tentatives++;
    var offset = Math.floor(Math.random() * (maxOffset - minOffset + 1)) + minOffset;
    var fausse;
    
    if (Math.random() < 0.5) fausse = bonne + offset;
    else fausse = bonne - offset;
    
    if (fausse <= 0 || fausse === bonne) continue;
    if (propositions.indexOf(fausse) !== -1) continue;
    
    propositions.push(fausse);
  }
  
  while (propositions.length < 4) {
    propositions.push(bonne + propositions.length * 2);
  }
  
  return melanger(propositions);
}

function melanger(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// ============================================================
// DÉMARRAGE
// ============================================================
function demarrerPartie(niveau) {
  niveauChoisi = niveau;
  questions = [];
  indexQuestion = 0;
  bonnesReponses = 0;
  
  for (var i = 0; i < NB_QUESTIONS; i++) {
    questions.push(genererQuestion(niveau));
  }
  
  document.getElementById('ecran-accueil').style.display = 'none';
  document.getElementById('ecran-jeu').style.display = 'block';
  document.getElementById('ecran-fin').style.display = 'none';
  
  var nomsNiveaux = { facile: '🟢 Facile', moyen: '🟡 Moyen', difficile: '🔴 Difficile' };
  document.getElementById('info-niveau').textContent = nomsNiveaux[niveau];
  
  afficherQuestion();
}

function afficherQuestion() {
  if (indexQuestion >= NB_QUESTIONS) {
    finDePartie();
    return;
  }
  
  var q = questions[indexQuestion];
  
  document.getElementById('info-question').textContent = 'Question ' + (indexQuestion + 1) + '/' + NB_QUESTIONS;
  var pourcentage = (indexQuestion / NB_QUESTIONS) * 100;
  document.getElementById('barre-remplissage').style.width = pourcentage + '%';
  
  document.getElementById('scenario-emoji').textContent = q.emoji;
  document.getElementById('scenario-texte').textContent = q.scenario;
  document.getElementById('scenario-detail').innerHTML = q.detail;
  document.getElementById('question-achat').textContent = q.question;
  
  mettreAJourEtoiles();
  
  var zone = document.getElementById('propositions-zone');
  var html = '';
  for (var i = 0; i < q.propositions.length; i++) {
    var p = q.propositions[i];
    var estBonne = (p === q.bonneReponse);
    html += '<button class="btn-prop" data-bonne="' + estBonne + '" onclick="repondre(this, ' + estBonne + ', \'' + formatPrix(q.bonneReponse) + '\')">';
    html += formatPrix(p);
    html += '</button>';
  }
  zone.innerHTML = html;
  
  var msg = document.getElementById('message');
  msg.className = 'message-zone info';
  msg.textContent = '👆 Calcule et choisis la bonne réponse !';
}

function mettreAJourEtoiles() {
  var zone = document.getElementById('score-etoiles');
  var html = '';
  for (var i = 0; i < NB_QUESTIONS; i++) {
    html += '<div class="etoile' + (i < bonnesReponses ? ' obtenue' : '') + '">⭐</div>';
  }
  zone.innerHTML = html;
}

// ============================================================
// RÉPONSE
// ============================================================
function repondre(bouton, estBonne, bonneReponseTexte) {
  var boutons = document.querySelectorAll('.btn-prop');
  for (var i = 0; i < boutons.length; i++) {
    boutons[i].disabled = true;
    if (boutons[i].getAttribute('data-bonne') === 'true') {
      boutons[i].classList.add('correct');
    }
  }
  
  var msg = document.getElementById('message');
  
  if (estBonne) {
    bonnesReponses++;
    bouton.classList.add('correct');
    jouerSucces();
    lancerConfetti();
    msg.className = 'message-zone succes';
    msg.textContent = '🎉 BRAVO ! La bonne réponse est ' + bonneReponseTexte;
    mettreAJourEtoiles();
  } else {
    bouton.classList.add('incorrect');
    jouerEchec();
    msg.className = 'message-zone erreur';
    msg.textContent = '❌ Presque ! La bonne réponse était ' + bonneReponseTexte;
    var carte = document.querySelector('#ecran-jeu .carte');
    carte.style.animation = 'secouer 0.3s';
    setTimeout(function(){ carte.style.animation = ''; }, 300);
  }
  
  indexQuestion++;
  setTimeout(afficherQuestion, 2300);
}

// ============================================================
// FIN
// ============================================================
function finDePartie() {
  document.getElementById('ecran-jeu').style.display = 'none';
  document.getElementById('ecran-fin').style.display = 'block';
  
  var titre = document.getElementById('titre-fin');
  var score = document.getElementById('score-final');
  
  if (bonnesReponses === NB_QUESTIONS) {
    titre.textContent = '🏆 PARFAIT !';
    score.innerHTML = 'Incroyable ! Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses !';
    for (var i = 0; i < 3; i++) setTimeout(lancerConfetti, i * 400);
  } else if (bonnesReponses >= 7) {
    titre.textContent = '🎉 TRÈS BIEN !';
    score.innerHTML = 'Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses !';
    lancerConfetti();
  } else if (bonnesReponses >= 5) {
    titre.textContent = '👍 PAS MAL !';
    score.innerHTML = 'Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses. Continue !';
  } else {
    titre.textContent = '💪 COURAGE !';
    score.innerHTML = 'Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses. Réessaie !';
  }
  
  var etoiles = document.getElementById('score-final-etoiles');
  var html = '';
  for (var j = 0; j < NB_QUESTIONS; j++) {
    html += '<div class="etoile' + (j < bonnesReponses ? ' obtenue' : '') + '">⭐</div>';
  }
  etoiles.innerHTML = html;
  
  jouerSon(523, 0.15, 'sine');
  setTimeout(function(){ jouerSon(659, 0.15, 'sine'); }, 150);
  setTimeout(function(){ jouerSon(784, 0.15, 'sine'); }, 300);
  setTimeout(function(){ jouerSon(1047, 0.4, 'sine'); }, 450);
}

function recommencer() {
  document.getElementById('ecran-accueil').style.display = 'block';
  document.getElementById('ecran-jeu').style.display = 'none';
  document.getElementById('ecran-fin').style.display = 'none';
}

function lancerConfetti() {
  var couleurs = ['#fbbf24', '#22c55e', '#ef4444', '#3b82f6', '#a855f7', '#ec4899', '#06b6d4'];
  for (var i = 0; i < 50; i++) {
    (function(idx) {
      setTimeout(function() {
        var c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.top = '-20px';
        c.style.background = couleurs[Math.floor(Math.random() * couleurs.length)];
        c.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
        document.body.appendChild(c);
        var startY = -20;
        var endY = window.innerHeight + 20;
        var duration = 1800 + Math.random() * 1200;
        var rotation = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 720);
        var startTime = null;
        function animer(timestamp) {
          if (!startTime) startTime = timestamp;
          var progress = (timestamp - startTime) / duration;
          if (progress < 1) {
            var y = startY + (endY - startY) * progress;
            c.style.top = y + 'px';
            c.style.transform = 'rotate(' + (rotation * progress) + 'deg)';
            requestAnimationFrame(animer);
          } else {
            if (c.parentNode) c.parentNode.removeChild(c);
          }
        }
        requestAnimationFrame(animer);
      }, idx * 25);
    })(i);
  }
}

document.addEventListener('click', function() { initAudio(); }, { once: true });
