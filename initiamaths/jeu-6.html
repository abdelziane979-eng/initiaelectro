<script>
var niveauChoisi = 'facile';
var questions = [];
var indexQuestion = 0;
var bonnesReponses = 0;
var NB_QUESTIONS = 10;
var audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function jouerSon(frequence, duree, type) {
  initAudio();
  if (!audioCtx) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = frequence;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duree);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duree);
  } catch(e) {}
}

function jouerSucces() {
  jouerSon(523, 0.1, 'sine');
  setTimeout(function(){ jouerSon(659, 0.1, 'sine'); }, 100);
  setTimeout(function(){ jouerSon(784, 0.2, 'sine'); }, 200);
}

function jouerEchec() {
  jouerSon(300, 0.15, 'square');
  setTimeout(function(){ jouerSon(200, 0.25, 'square'); }, 150);
}

// ============================================================
// BASE DE PROBLÈMES
// ============================================================
var PROBLEMES_FACILES = [

    a: function(){ return rand(5, 15); }, b: function(){ return rand(1, 4); },
    reponse: function(a, b){ return a - b; }, unite: 'cookies', operateur: '-' },
  { emoji: '🐦', texte: 'Il y a {a} oiseaux sur une branche. {b} oiseaux s\'envolent. Combien d\'oiseaux restent sur la branche ?',

    a: function(){ return rand(3, 10); }, b: function(){ return rand(3, 10); },
    reponse: function(a, b){ return a + b; }, unite: 'ballons', operateur: '+' },

    a: function(){ return rand(8, 20); }, b: function(){ return rand(2, 6); },
    reponse: function(a, b){ return a - b; }, unite: 'bonbons', operateur: '-' },
  { emoji: '⭐', texte: 'Dans la classe, il y a {a} filles et {b} garçons. Combien d\'élèves y a-t-il en tout ?',
    a: function(){ return rand(8, 15); }, b: function(){ return rand(8, 15); },
    reponse: function(a, b){ return a + b; }, unite: 'élèves', operateur: '+' },
  { emoji: '🚗', texte: 'Il y a {a} voitures dans le parking. {b} voitures partent. Combien de voitures restent ?',
    a: function(){ return rand(10, 25); }, b: function(){ return rand(3, 8); },
    reponse: function(a, b){ return a - b; }, unite: 'voitures', operateur: '-' },
  { emoji: '🐟', texte: 'Le pêcheur a attrapé {a} poissons le matin et {b} poissons l\'après-midi. Combien de poissons a-t-il attrapés en tout ?',
    a: function(){ return rand(4, 12); }, b: function(){ return rand(3, 10); },

];

var PROBLEMES_MOYENS = [
  { emoji: '💰', texte: 'Marc a {a} euros. Il achète un livre à {b} euros. Combien lui reste-t-il d\'argent ?',

  { emoji: '🏃', texte: 'Julie court {a} mètres le lundi et {b} mètres le mardi. Combien de mètres a-t-elle couru en tout ?',
    a: function(){ return rand(200, 800); }, b: function(){ return rand(150, 600); },
    reponse: function(a, b){ return a + b; }, unite: 'mètres', operateur: '+' },
  { emoji: '🎒', texte: 'Un magasin a {a} cartables. Il en vend {b} dans la journée. Combien de cartables reste-t-il ?',
    a: function(){ return rand(30, 80); }, b: function(){ return rand(10, 25); },
    reponse: function(a, b){ return a - b; }, unite: 'cartables', operateur: '-' },
  { emoji: '🌸', texte: 'Dans le jardin, il y a {a} tulipes et {b} roses. Combien de fleurs y a-t-il en tout ?',
    a: function(){ return rand(15, 40); }, b: function(){ return rand(12, 35); },
    reponse: function(a, b){ return a + b; }, unite: 'fleurs', operateur: '+' },
  { emoji: '🥛', texte: 'La ferme a produit {a} litres de lait le matin. Elle en vend {b} litres. Combien de litres reste-t-il ?',
    a: function(){ return rand(60, 120); }, b: function(){ return rand(20, 50); },
    reponse: function(a, b){ return a - b; }, unite: 'litres', operateur: '-' }
];

var PROBLEMES_DIFFICILES = [
  { emoji: '🍪', texte: 'Il y a {b} boîtes de {a} cookies chacune. Combien de cookies y a-t-il en tout ?',
    a: function(){ return rand(3, 9); }, b: function(){ return rand(2, 6); },
    reponse: function(a, b){ return a * b; }, unite: 'cookies', operateur: '×' },
  { emoji: '🎂', texte: 'Un gâteau est coupé en {b} parts égales. {a} enfants en mangent chacun {a} parts... Non ! Plus simple : {b} amis partagent {a} bonbons équitablement. Combien chacun reçoit-il ?',
    a: function(){ return rand(4, 12) * 4; }, b: function(){ return 4; },

  { emoji: '🍫', texte: 'Léa a {a} carrés de chocolat. Elle les partage équitablement entre {b} amis. Combien chaque ami reçoit-il ?',
    a: function(){ return rand(2, 10) * 3; }, b: function(){ return 3; },
    reponse: function(a, b){ return Math.floor(a / b); }, unite: 'carrés', operateur: '÷' },
  { emoji: '🎫', texte: 'Un cinéma a {b} salles de {a} places. Combien de places y a-t-il en tout ?',
    a: function(){ return rand(40, 90); }, b: function(){ return rand(3, 6); },
    reponse: function(a, b){ return a * b; }, unite: 'places', operateur: '×' },
  { emoji: '📦', texte: 'Un camion transporte {a} colis répartis dans {b} cartons. Combien de colis y a-t-il dans chaque carton ?',
    a: function(){ return rand(5, 15) * 5; }, b: function(){ return 5; },
    reponse: function(a, b){ return Math.floor(a / b); }, unite: 'colis', operateur: '÷' },
  { emoji: '🌳', texte: 'Il y a {b} rangées de {a} arbres. Combien d\'arbres y a-t-il en tout ?',
    a: function(){ return rand(8, 15); }, b: function(){ return rand(4, 8); },
    reponse: function(a, b){ return a * b; }, unite: 'arbres', operateur: '×' },
  { emoji: '🍬', texte: 'Un paquet contient {a} bonbons. On les répartit dans {b} sachets. Combien de bonbons dans chaque sachet ?',
    a: function(){ return rand(4, 10) * 4; }, b: function(){ return 4; },
    reponse: function(a, b){ return Math.floor(a / b); }, unite: 'bonbons', operateur: '÷' }
];

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// ============================================================
// GÉNÉRATION DES QUESTIONS
// ============================================================
function genererQuestion(niveau) {
  var base;
  if (niveau === 'facile') base = PROBLEMES_FACILES[Math.floor(Math.random() * PROBLEMES_FACILES.length)];
  else if (niveau === 'moyen') base = PROBLEMES_MOYENS[Math.floor(Math.random() * PROBLEMES_MOYENS.length)];
  else base = PROBLEMES_DIFFICILES[Math.floor(Math.random() * PROBLEMES_DIFFICILES.length)];
  
  var a = base.a();
  var b = base.b();
  
  // Ajuster pour éviter les cas impossibles
  if (base.operateur === '÷' && a % b !== 0) {
    a = Math.ceil(a / b) * b;
  }
  
  var texte = base.texte.replace(/{a}/g, a).replace(/{b}/g, b);
  var bonneReponse = base.reponse(a, b);
  
  var propositions = genererPropositions(bonneReponse, base.operateur);
  
  return {
    emoji: base.emoji,
    texte: texte,
    bonneReponse: bonneReponse,
    unite: base.unite,
    propositions: propositions,
    operateur: base.operateur,
    a: a,
    b: b
  };
}

function genererPropositions(bonne, operateur) {
  var propositions = [bonne];
  var tentatives = 0;
  
  while (propositions.length < 4 && tentatives < 200) {
    tentatives++;
    var val;
    var offset = Math.floor(Math.random() * 5) + 1;
    
    if (Math.random() < 0.5) val = bonne + offset;
    else val = bonne - offset;
    
    if (val < 0) val = bonne + offset;
    if (val === bonne) continue;
    if (propositions.indexOf(val) !== -1) continue;
    
    propositions.push(val);
  }
  
  while (propositions.length < 4) {
    propositions.push(bonne + propositions.length);
  }
  
  return melanger(propositions);
}

function melanger(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// ============================================================
// DÉMARRAGE
// ============================================================
function demarrerPartie(niveau) {
  niveauChoisi = niveau;
  questions = [];
  indexQuestion = 0;
  bonnesReponses = 0;
  
  for (var i = 0; i < NB_QUESTIONS; i++) {
    questions.push(genererQuestion(niveau));
  }
  
  document.getElementById('ecran-accueil').style.display = 'none';
  document.getElementById('ecran-jeu').style.display = 'block';
  document.getElementById('ecran-fin').style.display = 'none';
  
  var nomsNiveaux = { facile: '🟢 Facile', moyen: '🟡 Moyen', difficile: '🔴 Difficile' };
  document.getElementById('info-niveau').textContent = nomsNiveaux[niveau];
  
  afficherQuestion();
}

function afficherQuestion() {
  if (indexQuestion >= NB_QUESTIONS) {
    finDePartie();
    return;
  }
  
  var q = questions[indexQuestion];
  
  document.getElementById('info-question').textContent = 'Question ' + (indexQuestion + 1) + '/' + NB_QUESTIONS;
  var pourcentage = (indexQuestion / NB_QUESTIONS) * 100;
  document.getElementById('barre-remplissage').style.width = pourcentage + '%';
  
  document.getElementById('probleme-emoji').textContent = q.emoji;
  document.getElementById('probleme-texte').textContent = q.texte;
  
  mettreAJourEtoiles();
  
  var zone = document.getElementById('propositions-zone');
  var lettres = ['A', 'B', 'C', 'D'];
  var html = '';
  for (var i = 0; i < q.propositions.length; i++) {
    var p = q.propositions[i];
    var estBonne = (p === q.bonneReponse);
    html += '<button class="btn-prop" data-bonne="' + estBonne + '" onclick="repondre(this, ' + estBonne + ', ' + q.bonneReponse + ', \'' + q.unite + '\')">';
    html += '<span class="lettre">' + lettres[i] + '</span>';
    html += '<span>' + p + ' ' + q.unite + '</span>';
    html += '</button>';
  }
  zone.innerHTML = html;
  
  var msg = document.getElementById('message');
  msg.className = 'message-zone info';
  msg.textContent = '👆 Choisis la bonne réponse !';
}

function mettreAJourEtoiles() {
  var zone = document.getElementById('score-etoiles');
  var html = '';
  for (var i = 0; i < NB_QUESTIONS; i++) {
    html += '<div class="etoile' + (i < bonnesReponses ? ' obtenue' : '') + '">⭐</div>';
  }
  zone.innerHTML = html;
}

// ============================================================
// RÉPONSE
// ============================================================
function repondre(bouton, estBonne, bonneReponse, unite) {
  var boutons = document.querySelectorAll('.btn-prop');
  for (var i = 0; i < boutons.length; i++) {
    boutons[i].disabled = true;
    if (boutons[i].getAttribute('data-bonne') === 'true') {
      boutons[i].classList.add('correct');
    }
  }
  
  var msg = document.getElementById('message');
  
  if (estBonne) {
    bonnesReponses++;
    bouton.classList.add('correct');
    jouerSucces();
    lancerConfetti();
    msg.className = 'message-zone succes';
    msg.textContent = '🎉 BRAVO ! La réponse est ' + bonneReponse + ' ' + unite;
    mettreAJourEtoiles();
  } else {
    bouton.classList.add('incorrect');
    jouerEchec();
    msg.className = 'message-zone erreur';
    msg.textContent = '❌ Presque ! La bonne réponse était ' + bonneReponse + ' ' + unite;
    var carte = document.querySelector('#ecran-jeu .carte');
    carte.style.animation = 'secouer 0.3s';
    setTimeout(function(){ carte.style.animation = ''; }, 300);
  }
  
  indexQuestion++;
  setTimeout(afficherQuestion, 2200);
}

// ============================================================
// FIN
// ============================================================
function finDePartie() {
  document.getElementById('ecran-jeu').style.display = 'none';
  document.getElementById('ecran-fin').style.display = 'block';
  
  var titre = document.getElementById('titre-fin');
  var score = document.getElementById('score-final');
  
  if (bonnesReponses === NB_QUESTIONS) {
    titre.textContent = '🏆 PARFAIT !';
    score.innerHTML = 'Incroyable ! Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses !';
    for (var i = 0; i < 3; i++) setTimeout(lancerConfetti, i * 400);
  } else if (bonnesReponses >= 7) {
    titre.textContent = '🎉 TRÈS BIEN !';
    score.innerHTML = 'Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses !';
    lancerConfetti();
  } else if (bonnesReponses >= 5) {
    titre.textContent = '👍 PAS MAL !';
    score.innerHTML = 'Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses. Continue !';
  } else {
    titre.textContent = '💪 COURAGE !';
    score.innerHTML = 'Tu as <strong>' + bonnesReponses + '/' + NB_QUESTIONS + '</strong> bonnes réponses. Réessaie !';
  }
  
  var etoiles = document.getElementById('score-final-etoiles');
  var html = '';
  for (var j = 0; j < NB_QUESTIONS; j++) {
    html += '<div class="etoile' + (j < bonnesReponses ? ' obtenue' : '') + '">⭐</div>';
  }
  etoiles.innerHTML = html;
  
  jouerSon(523, 0.15, 'sine');
  setTimeout(function(){ jouerSon(659, 0.15, 'sine'); }, 150);
  setTimeout(function(){ jouerSon(784, 0.15, 'sine'); }, 300);
  setTimeout(function(){ jouerSon(1047, 0.4, 'sine'); }, 450);
}

function recommencer() {
  document.getElementById('ecran-accueil').style.display = 'block';
  document.getElementById('ecran-jeu').style.display = 'none';
  document.getElementById('ecran-fin').style.display = 'none';
}

function lancerConfetti() {
  var couleurs = ['#fbbf24', '#22c55e', '#ef4444', '#3b82f6', '#a855f7', '#ec4899', '#06b6d4'];
  for (var i = 0; i < 50; i++) {
    (function(idx) {
      setTimeout(function() {
        var c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.top = '-20px';
        c.style.background = couleurs[Math.floor(Math.random() * couleurs.length)];
        c.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
        document.body.appendChild(c);
        var startY = -20;
        var endY = window.innerHeight + 20;
        var duration = 1800 + Math.random() * 1200;
        var rotation = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 720);
        var startTime = null;
        function animer(timestamp) {
          if (!startTime) startTime = timestamp;
          var progress = (timestamp - startTime) / duration;
          if (progress < 1) {
            var y = startY + (endY - startY) * progress;
            c.style.top = y + 'px';
            c.style.transform = 'rotate(' + (rotation * progress) + 'deg)';
            requestAnimationFrame(animer);
          } else {
            if (c.parentNode) c.parentNode.removeChild(c);
          }
        }
        requestAnimationFrame(animer);
      }, idx * 25);
    })(i);
  }
}

document.addEventListener('click', function() { initAudio(); }, { once: true });

  navigator.serviceWorker.register('sw-maths.js').then(function(reg) {
