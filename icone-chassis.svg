<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Châssis en X -->
  <line x1="140" y1="140" x2="372" y2="372" stroke="#374151" stroke-width="28" stroke-linecap="round"/>
  <line x1="372" y1="140" x2="140" y2="372" stroke="#374151" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Stack central (ESC + FC) -->
  <rect x="216" y="216" width="80" height="80" rx="8" fill="#064e3b" stroke="#4ade80" stroke-width="6"/>
  <rect x="236" y="236" width="40" height="40" rx="4" fill="#111827"/>
  
  <!-- Moteurs -->
  <circle cx="140" cy="140" r="26" fill="#6b7280" stroke="#9ca3af" stroke-width="4"/>
  <circle cx="372" cy="140" r="26" fill="#6b7280" stroke="#9ca3af" stroke-width="4"/>
  <circle cx="140" cy="372" r="26" fill="#6b7280" stroke="#9ca3af" stroke-width="4"/>
  <circle cx="372" cy="372" r="26" fill="#6b7280" stroke="#9ca3af" stroke-width="4"/>
  
  <!-- Hélices CW (Rouges) sur M1 et M4 -->
  <line x1="90" y1="90" x2="190" y2="190" stroke="#ef4444" stroke-width="14" stroke-linecap="round"/>
  <line x1="190" y1="90" x2="90" y2="190" stroke="#ef4444" stroke-width="14" stroke-linecap="round"/>
  
  <line x1="322" y1="322" x2="422" y2="422" stroke="#ef4444" stroke-width="14" stroke-linecap="round"/>
  <line x1="422" y1="322" x2="322" y2="422" stroke="#ef4444" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Hélices CCW (Bleues) sur M2 et M3 -->
  <line x1="322" y1="90" x2="422" y2="190" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
  <line x1="422" y1="90" x2="322" y2="190" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
  
  <line x1="90" y1="322" x2="190" y2="422" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
  <line x1="190" y1="322" x2="90" y2="422" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
</svg>
