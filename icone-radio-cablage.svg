<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Boitier de la radio -->
  <rect x="96" y="150" width="320" height="220" rx="30" fill="#1e293b" stroke="#475569" stroke-width="8"/>
  
  <!-- Poignées latérales -->
  <rect x="66" y="180" width="30" height="160" rx="15" fill="#111827" stroke="#334155" stroke-width="4"/>
  <rect x="416" y="180" width="30" height="160" rx="15" fill="#111827" stroke="#334155" stroke-width="4"/>
  
  <!-- Écran OLED -->
  <rect x="196" y="170" width="120" height="50" rx="8" fill="url(#screen)"/>
  <text x="256" y="202" font-family="monospace" font-size="18" font-weight="bold" fill="#000" text-anchor="middle">12.5V</text>
  
  <!-- Antenne -->
  <line x1="350" y1="150" x2="400" y2="70" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="400" cy="70" r="10" fill="#fbbf24"/>
  
  <!-- Joystick Gauche -->
  <circle cx="166" cy="300" r="40" fill="#334155" stroke="#64748b" stroke-width="6"/>
  <circle cx="166" cy="290" r="18" fill="#ef4444"/>
  
  <!-- Joystick Droit -->
  <circle cx="346" cy="300" r="40" fill="#334155" stroke="#64748b" stroke-width="6"/>
  <circle cx="346" cy="290" r="18" fill="#3b82f6"/>
  
  <!-- Fils de câblage décoratifs (rappel de l'atelier) -->
  <!-- Fil rouge -->
  <path d="M 256 150 L 256 100 L 200 100" stroke="#ef4444" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="100" r="8" fill="#ef4444"/>
  
  <!-- Fil noir -->
  <path d="M 256 150 L 256 80 L 320 80" stroke="#111" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="320" cy="80" r="8" fill="#111" stroke="#fff" stroke-width="2"/>
  
  <!-- Fil jaune -->
  <path d="M 256 150 L 256 120 L 180 120" stroke="#eab308" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="120" r="8" fill="#eab308"/>
</svg>
